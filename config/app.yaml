model:
  baseUrl: your-base-url
  modelName: qwen3.7-plus
  textOnlyModelName: qwen3.7-max
  enableThinking: true
  temperature: 0.0
  maxTokens: 8192
  timeoutSeconds: 360

platform:
  baseUrl: http://10.199.100.253/api
  paths:
    login: /identity/anonymity/unsafe/login
    imageList: /resource-manager/image/list
    flavorList: /resource-manager/flavor/listBySpace
    topologyClear: /topo-edit/topo/{projectId}/clearTopo/{networkId}
    topologyImport: /topo-edit/projects/meshTopo/agent/import
  successCodes: [1, 200]
  timeoutSeconds: 30

image:
  maxWidth: 4096
  maxHeight: 4096
  tileWidth: 512
  tileHeight: 512
  overlapRatio: 0.20

defaults:
  version: v2
  mtu: 1350
  enableDhcp: true
  dns: ""

budget:
  maxModelCalls: 12
  maxLocalReviews: 1

runtime:
  runsDir: runtime/runs
