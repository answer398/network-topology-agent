model:
  baseUrl: https://open.bigmodel.cn/api/paas/v4/
  modelName: GLM-5V-Turbo
  temperature: 0.0
  maxTokens: 8192
  timeoutSeconds: 360

platform:
  baseUrl: https://example.invalid
  paths:
    login: /identity/anonymity/unsafe/login
    imageList: /image/list
    flavorList: /flavor/listBySpace
    topologyImport: /projects/meshTopo/agent/import
  successCodes: [1, 200]
  timeoutSeconds: 30

image:
  maxWidth: 4096
  maxHeight: 4096
  tileWidth: 512
  tileHeight: 512
  overlapRatio: 0.20

defaults:
  version: v2
  mtu: 1350
  enableDhcp: true
  dns: ""

budget:
  maxModelCalls: 12
  maxLocalReviews: 1

runtime:
  runsDir: runtime/runs
