[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-agent"
version = "0.1.0"
description = "Network topology recognition agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<3",
    "httpx>=0.28,<1",
    "Pillow>=12.3,<13",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "requests>=2,<3",
]

[tool.setuptools]
packages = ["topology_agent", "api"]
package-dir = {"" = "src", "api" = "api"}
