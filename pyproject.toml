[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-agent"
version = "0.1.0"
description = "Network topology recognition agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
